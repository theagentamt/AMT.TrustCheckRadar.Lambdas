name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Build Lambda packages
        run: ./scripts/build_lambda_zip.sh --all

      - name: Upload packages for inspection
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lambda-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90


  resolver-python-314:
    name: Resolver Python 3.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test resolver
        run: python -m pytest -q tests/url_redirect_resolver

      - name: Build resolver for Python 3.14 ARM64
        run: ./scripts/build_lambda_zip.sh --function url_redirect_resolver --arch arm64

      - name: Verify packaged resolver handler
        env:
          PYTHONPATH: dist/url_redirect_resolver.zip
        run: |
          python - <<'PY'
          from app import lambda_handler
          import dns.resolver

          class Context:
              def get_remaining_time_in_millis(self):
                  return 12000

          result = lambda_handler({
              "schemaVersion": 1, "checkId": "ci-py314",
              "url": "http://169.254.169.254/latest/meta-data/",
          }, Context())
          assert result["resolutionStatus"] == "blocked"
          assert result["reasonCodes"] == ["NON_PUBLIC_DESTINATION"]
          assert result["requestCount"] == 0
          PY
