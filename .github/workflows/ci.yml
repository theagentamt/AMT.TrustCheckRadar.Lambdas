name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Build Lambda packages
        run: ./scripts/build_lambda_zip.sh --all

      - name: Record main push release scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/lambda_release_scope.py --base "$BEFORE_SHA" --head "$SOURCE_SHA" --output dist/release-scope.json

      - name: Upload packages for inspection
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lambda-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/release-scope.json
          if-no-files-found: error
          retention-days: 90


  resolver-python-314:
    name: Resolver Python 3.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test resolver
        run: python -m pytest -q tests/url_redirect_resolver tests/url_assessment

      - name: Build resolver for Python 3.14 ARM64
        run: ./scripts/build_lambda_zip.sh --function url_redirect_resolver --arch arm64

      - name: Build private assessment for Python 3.14 ARM64
        run: ./scripts/build_lambda_zip.sh --function url_assessment --arch arm64

      - name: Verify packaged resolver handler
        env:
          PYTHONPATH: dist/url_redirect_resolver.zip
        run: |
          python - <<'PY'
          from app import lambda_handler
          import dns.resolver

          class Context:
              def get_remaining_time_in_millis(self):
                  return 12000

          result = lambda_handler({
              "schemaVersion": 1, "checkId": "ci-py314",
              "url": "http://169.254.169.254/latest/meta-data/",
          }, Context())
          assert result["resolutionStatus"] == "blocked"
          assert result["reasonCodes"] == ["NON_PUBLIC_DESTINATION"]
          assert result["requestCount"] == 0
          PY

      - name: Verify packaged private assessment handler
        env:
          PYTHONPATH: dist/url_assessment.zip
          STAGE: dev
        run: |
          python - <<'PYTHON'
          from app import lambda_handler

          class Context:
              def get_remaining_time_in_millis(self):
                  return 35000

          result = lambda_handler({
              "schemaVersion": 1, "checkId": "ci-private-assessment",
              "url": "http://169.254.169.254/latest/meta-data/", "scope": "full_url",
          }, Context())
          assert result["processingOutcome"] == "blocked"
          assert result["verdict"] == "unknown"
          assert result["providerCallCount"] == 0
          assert result["consumerAccessEnabled"] is False
          PYTHON
