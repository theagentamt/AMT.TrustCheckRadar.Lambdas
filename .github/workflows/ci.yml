name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Build Lambda packages
        run: ./scripts/build_lambda_zip.sh --all

      - name: Upload packages for inspection
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lambda-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  build-feature-image:
    if: github.event_name == 'push'
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable ARM64 feature image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --output type=docker,dest=campaign-feature-extractor.tar \
            --tag "campaign-feature-extractor:${GITHUB_SHA}" \
            src/campaign_feature_extractor

      - name: Upload feature image for promotion
        uses: actions/upload-artifact@v7.0.1
        with:
          name: campaign-feature-image
          path: campaign-feature-extractor.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
