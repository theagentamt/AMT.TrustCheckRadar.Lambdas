name: Publish Lambda release

on:
  workflow_run:
    branches:
      - main
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Main CI promotion or reviewed Dev candidate publication
        required: true
        default: main_ci
        type: choice
        options:
          - main_ci
          - research_candidate
          - message_candidate
      source_sha:
        description: Exact dispatch-ref commit for a reviewed Dev candidate (must equal dispatch ref)
        required: false
        type: string
      environment:
        description: Environment artifact bucket to publish to
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prod
      source_run_id:
        description: Successful main-branch CI run for main_ci mode
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lambda-publish-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'main_ci') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       vars.ENABLE_DEV_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Resolve and validate source CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            source_run_id="${COMPLETED_RUN_ID}"
          else
            source_run_id="${REQUESTED_RUN_ID}"
          fi

          [[ "${source_run_id}" =~ ^[0-9]+$ ]] || {
            echo "source_run_id must be a numeric GitHub Actions run ID" >&2
            exit 2
          }

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
          workflow_name="$(jq -r '.name' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          event="$(jq -r '.event' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch' <<<"${run_json}")"
          source_sha="$(jq -r '.head_sha' <<<"${run_json}")"

          [[ "${workflow_name}" == "CI" ]] || {
            echo "Run ${source_run_id} belongs to '${workflow_name}', not CI" >&2
            exit 2
          }
          [[ "${conclusion}" == "success" && "${event}" == "push" && "${head_branch}" == "main" ]] || {
            echo "Run ${source_run_id} must be a successful CI push run on main" >&2
            exit 2
          }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Run ${source_run_id} returned an invalid source SHA" >&2
            exit 2
          }

          {
            echo "run_id=${source_run_id}"
            echo "source_sha=${source_sha}"
            echo "release_id=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate environment configuration
        run: |
          set -euo pipefail
          [[ -n "${AWS_REGION}" ]] || { echo "GitHub environment variable AWS_REGION is required" >&2; exit 2; }
          [[ -n "${AWS_ROLE_ARN}" ]] || { echo "GitHub environment variable AWS_ROLE_ARN is required" >&2; exit 2; }
          [[ -n "${ARTIFACT_BUCKET}" ]] || { echo "GitHub environment variable ARTIFACT_BUCKET is required" >&2; exit 2; }
          [[ "${AWS_ROLE_ARN}" =~ ^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+ ]] || {
            echo "AWS_ROLE_ARN is not a valid IAM role ARN" >&2
            exit 2
          }

      - name: Check out the released source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Download exact CI packages
        uses: actions/download-artifact@v8
        with:
          name: lambda-packages
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Validate release scope
        id: scope
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path("dist/release-scope.json").read_text())
          assert manifest.get("schemaVersion") == 1
          assert manifest.get("headSha") == os.environ["SOURCE_SHA"]
          assert re.fullmatch("[0-9a-f]{40}", manifest.get("baseSha", ""))
          assert manifest.get("scope") in {"resolver", "entitlements", "all", "contracts", "assessment_manual", "authority_manual"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("value=" + manifest["scope"] + "\n")
          PYTHON

      - name: Verify package checksums and contents
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          python3 - <<'PYTHON'
          from pathlib import Path

          contract_packages = {
              "campaign-contracts-1.0.0.zip",
              "history-contracts-1.0.0.zip",
              "device-recovery-contracts-1.0.0.zip",
          }
          function_packages = {
              f"{path.parent.name}.zip" for path in Path("../src").glob("*/app.py")
          }
          expected = function_packages | contract_packages
          actual = {path.name for path in Path(".").glob("*.zip")}
          manifest = {
              line.partition("  ")[2]
              for line in Path("SHA256SUMS").read_text(encoding="utf-8").splitlines()
              if line.partition("  ")[1]
          }
          if actual != expected:
              raise SystemExit(
                  f"release ZIP inventory mismatch; missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}"
              )
          if manifest != actual:
              raise SystemExit(
                  f"checksum inventory mismatch; missing={sorted(actual - manifest)}, "
                  f"unexpected={sorted(manifest - actual)}"
              )
          PYTHON
          for artifact in *.zip; do
            if [[ "${artifact}" == campaign-contracts-1.0.0.zip || "${artifact}" == history-contracts-1.0.0.zip || "${artifact}" == device-recovery-contracts-1.0.0.zip ]]; then
              unzip -Z1 "${artifact}" contract-set.json | grep -Fxq contract-set.json || {
                echo "${artifact} does not contain contract-set.json at its root" >&2
                exit 2
              }
            else
              unzip -Z1 "${artifact}" app.py | grep -Fxq app.py || {
                echo "${artifact} does not contain app.py at its root" >&2
                exit 2
              }
            fi
          done

      - name: Configure short-lived AWS credentials
        if: steps.scope.outputs.value == 'resolver' || steps.scope.outputs.value == 'entitlements' || steps.scope.outputs.value == 'all'
        id: aws
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: trustcheckradar-lambdas-${{ github.run_id }}

      - name: Verify AWS account and target bucket
        if: steps.scope.outputs.value == 'resolver' || steps.scope.outputs.value == 'entitlements' || steps.scope.outputs.value == 'all'
        run: |
          set -euo pipefail
          expected_account_id="${AWS_ROLE_ARN#*::}"
          expected_account_id="${expected_account_id%%:*}"
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${actual_account_id}" == "${expected_account_id}" ]] || {
            echo "Assumed role account does not match AWS_ROLE_ARN" >&2
            exit 2
          }
          aws s3api head-bucket --bucket "${ARTIFACT_BUCKET}"

      - name: Publish only the resolver artifact
        if: steps.scope.outputs.value == 'resolver'
        env:
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
        run: |
          python3 scripts/publish_url_resolver.py --dist-dir dist \
            --bucket "$ARTIFACT_BUCKET" --release "$RELEASE_ID" \
            --region "$AWS_REGION" --output dist/url-resolver-publication.json

      - name: Preserve resolver publication evidence
        if: steps.scope.outputs.value == 'resolver'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: url-resolver-publication
          path: dist/url-resolver-publication.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish only the V1 entitlements artifact
        if: steps.scope.outputs.value == 'entitlements'
        env:
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
        run: |
          python3 scripts/publish_v1_entitlements.py --dist-dir dist \
            --bucket "$ARTIFACT_BUCKET" --release "$RELEASE_ID" \
            --region "$AWS_REGION" --output dist/v1-entitlements-publication.json

      - name: Preserve V1 entitlements publication evidence
        if: steps.scope.outputs.value == 'entitlements'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: v1-entitlements-publication
          path: dist/v1-entitlements-publication.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable Lambda ZIP release
        if: steps.scope.outputs.value == 'all'
        run: |
          bash scripts/upload_lambda_zips.sh \
            --dist-dir dist \
            --bucket "${ARTIFACT_BUCKET}" \
            --release "${{ steps.source.outputs.release_id }}" \
            --region "${AWS_REGION}" \
            --include-optional true

      - name: Write release summary
        env:
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          RELEASE_SCOPE: ${{ steps.scope.outputs.value }}
        run: |
          {
            echo "## Release validation complete"
            echo "- Scope: \`$RELEASE_SCOPE\`"
            echo
            echo "- Environment: \`${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}\`"
            echo "- Source CI run: \`${SOURCE_RUN_ID}\`"
            echo "- Source commit/release: \`${RELEASE_ID}\`"
            if [[ "$RELEASE_SCOPE" == "resolver" || "$RELEASE_SCOPE" == "entitlements" || "$RELEASE_SCOPE" == "all" ]]; then
              echo "- ZIP location: \`s3://${ARTIFACT_BUCKET}/releases/${RELEASE_ID}/\`"
            fi
            echo
            echo "This publishes immutable artifacts only. Resolver scope uploads only url_redirect_resolver.zip; entitlements scope uploads only v1_entitlements.zip. Contracts, assessment_manual, and authority_manual scopes skip AWS credentials and all uploads. No scope deploys or updates a Lambda runtime or alias."
          } >> "${GITHUB_STEP_SUMMARY}"


  research-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release-V01' &&
      inputs.mode == 'research_candidate' && inputs.environment == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Validate exact release and Dev target
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ -z "$SOURCE_RUN_ID" ]]
          [[ "$ARTIFACT_BUCKET" == 'trustcheckradar-dev-107827791950-artifacts' ]]
          [[ "$AWS_REGION" == 'us-east-1' ]]
          [[ "$AWS_ROLE_ARN" == 'arn:aws:iam::107827791950:role/trustcheckradar-dev-lambda-publisher' ]]
      - name: Check out exact reviewed release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install local validation dependencies
        run: python -m pip install --requirement requirements-dev.txt 'moto[dynamodb]==5.2.3'
      - name: Run ordinary source gates
        run: |
          python -m pytest -q
          python -m compileall -q src tests scripts
      - name: Run consent and campaign emulator gates in their isolated process
        env:
          AMT_AUTHORITY_INTEGRATION: '1'
          AWS_DEFAULT_REGION: us-east-1
        run: >-
          python -m pytest -q
          tests/shared_campaign_locators/test_dynamodb.py
          tests/campaign_lifecycle/test_publication_dynamodb.py
          tests/campaign_participation/test_migration_dynamodb.py
      - name: Run retired replay and inventory gates in their isolated process
        env:
          AMT_AUTHORITY_INTEGRATION: '1'
          AWS_DEFAULT_REGION: us-east-1
        run: >-
          python -m pytest -q
          tests/legacy_retirement/test_boundary_dynamodb.py
          tests/legacy_retirement/test_inventory_cli.py
      - name: Build exactly nine full-dependency candidate packages
        run: |
          set -euo pipefail
          for function in campaign_participation campaign_observation_publisher campaign_cluster_aggregator campaign_deletion_bridge campaign_lifecycle conversation_analysis entitlement_snapshot web_risk_communication purchase_handoff; do
            bash scripts/build_lambda_zip.sh --function "$function" --python-version 3.14 --arch arm64
          done
          python - <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          dist = Path('dist')
          (dist / 'SHA256SUMS').write_text(''.join(
              sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(dist.glob('*.zip'))))
          PYTHON
          python scripts/publish_research_candidate.py --dist-dir dist --source-sha "$SOURCE_SHA" --smoke --output dist/research-candidate-build.json
      - name: Preserve candidate build evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: research-candidate-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/research-candidate-build.json
          if-no-files-found: error
          retention-days: 90
      - name: Configure scoped short-lived publisher credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: research-candidate-${{ github.run_id }}
      - name: Verify account and publish immutable Dev objects
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == '107827791950' ]]
          python scripts/publish_research_candidate.py --dist-dir dist --source-sha "$SOURCE_SHA" --publish --bucket "$ARTIFACT_BUCKET" --region "$AWS_REGION" --output dist/research-candidate-publication.json
      - name: Preserve exact S3 versions and checksums
        uses: actions/upload-artifact@v7.0.1
        with:
          name: research-candidate-publication
          path: dist/research-candidate-publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Record publication boundary
        run: |
          {
            echo '## Dev candidate artifacts published'
            echo "Source commit: $SOURCE_SHA"
            echo 'Nine immutable ZIPs published; exact S3 versions and checksums are in research-candidate-publication.'
            echo 'No runtime, alias, route, IAM, data, migration gate or consumer changed. Deployment and availability qualification remain separate.'
            echo 'Python 3.14 source compile/import checks do not qualify native ARM64 extension execution.'
          } >> "$GITHUB_STEP_SUMMARY"


  message-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/release-V01' || github.ref == 'refs/heads/main') &&
      inputs.mode == 'message_candidate' && inputs.environment == 'dev'
    # The packages contain the ARM64 rpds native extension; execute the package
    # smoke on the same OS/architecture family used by Lambda.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: dev
    env:
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Validate exact release and Dev target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$ARTIFACT_BUCKET" == 'trustcheckradar-dev-107827791950-artifacts' ]]
          [[ "$AWS_REGION" == 'us-east-1' ]]
          [[ "$AWS_ROLE_ARN" == 'arn:aws:iam::107827791950:role/trustcheckradar-dev-lambda-publisher' ]]
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
            [[ "$(jq -r '.name' <<<"$run_json")" == 'CI' ]]
            [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]]
            [[ "$(jq -r '.event' <<<"$run_json")" == 'push' ]]
            [[ "$(jq -r '.head_branch' <<<"$run_json")" == 'main' ]]
            [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$SOURCE_SHA" ]]
          else
            [[ "$GITHUB_REF" == 'refs/heads/release-V01' ]]
            [[ -z "$SOURCE_RUN_ID" ]]
          fi
      - name: Check out exact reviewed release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          # Compatibility tests load the exact previously installed authority
          # implementation by commit, so a shallow checkout is insufficient.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install local validation dependencies
        run: python -m pip install --requirement requirements-dev.txt 'moto[dynamodb]==5.2.3'
      - name: Run governed-message source gates
        env:
          AMT_AUTHORITY_INTEGRATION: '1'
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pytest -q tests/message_consumer tests/message_evaluator tests/shared_check_authority tests/scripts/test_publish_message_candidate.py
          python -m compileall -q src/message_consumer src/message_evaluator src/shared_message_contract src/shared_check_authority scripts/publish_message_candidate.py
      - name: Build exactly two full-dependency Python 3.14 ARM64 packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir dist
          for function in message_consumer message_evaluator; do
            bash scripts/build_lambda_zip.sh --function "$function" --python-version 3.14 --arch arm64 --output-dir dist
          done
          python - <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          dist = Path('dist')
          (dist / 'SHA256SUMS').write_text(''.join(
              sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in sorted(dist.glob('*.zip'))))
          PYTHON
          python scripts/publish_message_candidate.py --dist-dir dist --source-sha "$SOURCE_SHA" --smoke --output dist/message-candidate-build.json
      - name: Preserve candidate build evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: message-candidate-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/message-candidate-build.json
          if-no-files-found: error
          retention-days: 90
      - name: Configure scoped short-lived publisher credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: message-candidate-${{ github.run_id }}
      - name: Verify account and publish immutable Dev objects
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == '107827791950' ]]
          python scripts/publish_message_candidate.py --dist-dir dist --source-sha "$SOURCE_SHA" --publish --bucket "$ARTIFACT_BUCKET" --region "$AWS_REGION" --output dist/message-candidate-publication.json
      - name: Preserve exact S3 versions and checksums
        uses: actions/upload-artifact@v7.0.1
        with:
          name: message-candidate-publication
          path: dist/message-candidate-publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Record publication boundary
        run: |
          {
            echo '## Governed-message Dev candidate artifacts published'
            echo "Source commit: $SOURCE_SHA"
            if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
              echo "Source CI run: $SOURCE_RUN_ID"
            else
              echo 'Source validation: reviewed release-V01 candidate gates in this run'
            fi
            echo 'Two immutable ZIPs published; exact S3 versions and checksums are in message-candidate-publication.'
            echo 'No runtime, alias, route, IAM, data, secret or activation setting changed.'
          } >> "$GITHUB_STEP_SUMMARY"
